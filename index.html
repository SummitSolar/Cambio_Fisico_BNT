<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transformación — Seguimiento diario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0B0A08;
    --surface:#161309;
    --surface-2:#1E1A11;
    --border:#2C2619;
    --border-soft:#211D14;
    --text:#F2EDE3;
    --text-muted:#A79A82;
    --text-faint:#6E6555;
    --gold:#CBA35C;
    --gold-bright:#E4C07E;
    --gold-wash:rgba(203,163,92,0.12);
    --green:#8AAE84;
    --red:#C1614C;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
    --font-serif:'Fraunces', Georgia, 'Times New Roman', serif;
    --font-sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }

  .app{
    max-width:560px;
    margin:0 auto;
    padding:20px 18px calc(56px + env(safe-area-inset-bottom));
  }

  section{ margin-top:26px; }

  h2{
    font-family:var(--font-serif);
    font-weight:500;
    font-size:20px;
    margin:0 0 12px;
    color:var(--text);
  }

  button{ font-family:inherit; }

  /* ---------- Barra superior ---------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding-top:4px;
  }
  .topbar .dia{
    font-size:13px;
    color:var(--text-muted);
    letter-spacing:0.01em;
  }
  .topbar .fecha-hoy{
    font-size:13px;
    color:var(--text-faint);
    text-align:right;
  }

  /* ---------- Tarjeta hero ---------- */
  .card-hero{
    position:relative;
    overflow:hidden;
    margin-top:16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:26px 24px 24px;
  }
  .card-hero::before{
    content:'';
    position:absolute;
    top:-60px; right:-60px;
    width:220px; height:220px;
    background:radial-gradient(circle, var(--gold-wash) 0%, transparent 72%);
    pointer-events:none;
  }
  .card-hero .etiqueta{
    font-size:13px;
    color:var(--text-muted);
    margin:0 0 6px;
  }
  .card-hero .peso-actual{
    font-family:var(--font-serif);
    font-weight:400;
    font-size:clamp(52px, 15vw, 72px);
    line-height:1;
    letter-spacing:-0.01em;
    margin:0;
    font-variant-numeric:tabular-nums;
  }
  .card-hero .peso-actual small{
    font-size:0.34em;
    font-weight:400;
    color:var(--text-muted);
    margin-left:6px;
  }
  .card-hero .delta{
    margin:10px 0 22px;
    font-size:14.5px;
    color:var(--text-muted);
  }
  .card-hero .delta strong{ font-weight:600; }
  .delta.positivo strong{ color:var(--green); }
  .delta.negativo strong{ color:var(--red); }

  .barra-progreso{
    position:relative;
    height:8px;
    border-radius:999px;
    background:var(--surface-2);
    overflow:hidden;
  }
  .barra-progreso .relleno{
    position:absolute; left:0; top:0; bottom:0;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--gold) 0%, var(--gold-bright) 100%);
    transition:width 0.9s cubic-bezier(.22,.9,.32,1);
  }
  .barra-flancos{
    display:flex;
    justify-content:space-between;
    margin-top:9px;
    font-size:12.5px;
    color:var(--text-faint);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- Tarjetas de estadísticas ---------- */
  .stats-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-top:12px;
  }
  .card-stat{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px 12px;
    text-align:left;
  }
  .card-stat .etiqueta{
    font-size:12px;
    color:var(--text-muted);
    margin:0 0 4px;
  }
  .card-stat .valor{
    font-family:var(--font-serif);
    font-size:24px;
    font-weight:500;
    margin:0;
    font-variant-numeric:tabular-nums;
  }
  .card-stat.acento .valor{ color:var(--gold-bright); }

  /* ---------- Gráfico ---------- */
  .chips{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
    margin-bottom:14px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-muted);
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  .chip.activo{
    background:var(--gold-wash);
    border-color:var(--gold);
    color:var(--gold-bright);
  }
  .chart-wrap{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:16px 14px 8px;
    height:230px;
  }
  .estado-vacio{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--text-faint);
    font-size:13.5px;
    padding:0 20px;
  }

  /* ---------- Formulario ---------- */
  .form-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px 16px;
  }
  .campo{ margin-bottom:14px; }
  .campo label{
    display:block;
    font-size:12.5px;
    color:var(--text-muted);
    margin-bottom:6px;
  }
  .fila-2, .fila-4{
    display:grid;
    gap:10px;
  }
  .fila-2{ grid-template-columns:1fr 1fr; }
  .fila-4{ grid-template-columns:repeat(4, 1fr); }

  input, textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:11px 12px;
    font-size:15.5px;
    font-family:inherit;
    font-variant-numeric:tabular-nums;
  }
  .fila-4 input{ padding:11px 8px; font-size:14.5px; text-align:center; }
  input::placeholder, textarea::placeholder{ color:var(--text-faint); }
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 0 3px var(--gold-wash);
  }
  textarea{ resize:vertical; min-height:56px; }

  .btn-guardar{
    width:100%;
    padding:14px;
    margin-top:6px;
    border:none;
    border-radius:var(--radius-sm);
    background:var(--gold);
    color:#1A1409;
    font-weight:600;
    font-size:15.5px;
    cursor:pointer;
    transition:background 0.15s, opacity 0.15s;
  }
  .btn-guardar:active{ background:var(--gold-bright); }
  .btn-guardar:disabled{ opacity:0.6; cursor:default; }

  /* ---------- Historial ---------- */
  .mes-grupo{
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    overflow:hidden;
    margin-bottom:10px;
    background:var(--surface);
  }
  .mes-cabecera{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px;
    background:none;
    border:none;
    color:var(--text);
    font-size:15px;
    font-family:var(--font-serif);
    cursor:pointer;
  }
  .mes-cabecera .conteo{
    font-family:var(--font-sans);
    font-size:12.5px;
    color:var(--text-faint);
  }
  .mes-cabecera .flecha{
    display:inline-block;
    margin-left:10px;
    transition:transform 0.2s;
    color:var(--text-faint);
    font-family:var(--font-sans);
  }
  .mes-grupo.abierto .mes-cabecera .flecha{ transform:rotate(180deg); }

  .dias-lista{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.25s ease;
    border-top:1px solid var(--border-soft);
  }
  .mes-grupo.abierto .dias-lista{ border-top:1px solid var(--border-soft); }

  .dia-fila{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:11px 16px;
    background:none;
    border:none;
    border-bottom:1px solid var(--border-soft);
    color:var(--text);
    font-size:14px;
    cursor:pointer;
    text-align:left;
  }
  .dia-fila:last-child{ border-bottom:none; }
  .dia-fila .izq{ display:flex; flex-direction:column; gap:2px; }
  .dia-fila .fecha-corta{ font-variant-numeric:tabular-nums; }
  .dia-fila .entreno-tag{ font-size:12px; color:var(--text-faint); }
  .dia-fila .der{ display:flex; align-items:baseline; gap:10px; font-variant-numeric:tabular-nums; }
  .dia-fila .peso-dia{ font-weight:600; }
  .dia-fila .cal-dia{ font-size:12.5px; color:var(--text-faint); }

  .dia-detalle{
    display:none;
    padding:4px 16px 14px;
    border-bottom:1px solid var(--border-soft);
    font-size:13px;
    color:var(--text-muted);
  }
  .dia-detalle.visible{ display:block; }
  .dia-detalle .medidas{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:6px;
  }
  .dia-detalle .medidas span b{ color:var(--text); font-variant-numeric:tabular-nums; }
  .dia-detalle .notas-dia{ color:var(--text-faint); font-style:italic; }

  .estado-vacio-historial{
    text-align:center;
    color:var(--text-faint);
    font-size:13.5px;
    padding:24px 20px;
    border:1px dashed var(--border);
    border-radius:var(--radius-md);
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 18px;
    border-radius:999px;
    font-size:13.5px;
    opacity:0;
    transition:opacity 0.2s, transform 0.2s;
    pointer-events:none;
    max-width:90%;
    text-align:center;
  }
  .toast.mostrar{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .toast.error{ border-color:var(--red); color:#F0C9C0; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.01ms !important; animation-duration:0.01ms !important; }
  }

  /* ---------- Layout de escritorio ---------- */
  @media (min-width: 860px){
    .app{ max-width:900px; padding:32px 24px 60px; }
    main{
      display:grid;
      grid-template-columns:340px 1fr;
      gap:24px;
      align-items:start;
    }
    .col-izq{ position:sticky; top:24px; }
    .col-der > section:first-child{ margin-top:0; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <span class="dia" id="txtDiaContador">Día —</span>
    <span class="fecha-hoy" id="txtFechaHoy"></span>
  </header>

  <main>
    <div class="col-izq">
      <section class="hero" aria-live="polite">
        <div class="card-hero">
          <p class="etiqueta">Peso actual</p>
          <p class="peso-actual" id="txtPesoActual">— <small>kg</small></p>
          <p class="delta" id="txtDelta">Cargando tu progreso…</p>

          <div class="barra-progreso"><div class="relleno" id="barraRelleno"></div></div>
          <div class="barra-flancos">
            <span id="txtFlancoInicial">— kg</span>
            <span id="txtFlancoMeta">— kg</span>
          </div>
        </div>

        <div class="stats-row">
          <div class="card-stat">
            <p class="etiqueta">Inicial</p>
            <p class="valor" id="txtStatInicial">—</p>
          </div>
          <div class="card-stat">
            <p class="etiqueta">Meta</p>
            <p class="valor" id="txtStatMeta">—</p>
          </div>
          <div class="card-stat acento">
            <p class="etiqueta">Progreso</p>
            <p class="valor" id="txtStatProgreso">—</p>
          </div>
        </div>
      </section>

      <section class="form-section">
        <h2>Registro de hoy</h2>
        <form class="form-card" id="formRegistro">
          <div class="fila-2">
            <div class="campo">
              <label for="inputFecha">Fecha</label>
              <input type="date" id="inputFecha" required>
            </div>
            <div class="campo">
              <label for="inputPeso">Peso (kg)</label>
              <input type="number" id="inputPeso" step="0.1" inputmode="decimal" placeholder="0.0" required>
            </div>
          </div>

          <div class="fila-2">
            <div class="campo">
              <label for="inputCalorias">Calorías consumidas</label>
              <input type="number" id="inputCalorias" inputmode="numeric" placeholder="Ej. 2100">
            </div>
            <div class="campo">
              <label for="inputEntrenamiento">Entrenamiento</label>
              <input type="text" id="inputEntrenamiento" placeholder="Ej. Pierna, Descanso">
            </div>
          </div>

          <div class="campo">
            <label>Medidas (cm) — opcional</label>
            <div class="fila-4">
              <input type="number" id="inputCintura" step="0.1" placeholder="Cintura">
              <input type="number" id="inputPecho" step="0.1" placeholder="Pecho">
              <input type="number" id="inputBrazos" step="0.1" placeholder="Brazos">
              <input type="number" id="inputPiernas" step="0.1" placeholder="Piernas">
            </div>
          </div>

          <div class="campo">
            <label for="inputNotas">Notas</label>
            <textarea id="inputNotas" placeholder="Cómo te sentiste, sueño, energía…"></textarea>
          </div>

          <button type="submit" class="btn-guardar" id="btnGuardar">Guardar registro</button>
        </form>
      </section>
    </div>

    <div class="col-der">
      <section class="chart-section">
        <h2>Evolución del peso</h2>
        <div class="chips" id="chipsMeses"></div>
        <div class="chart-wrap">
          <canvas id="graficoPeso"></canvas>
        </div>
      </section>

      <section class="history-section">
        <h2>Historial</h2>
        <div id="listaHistorial"></div>
      </section>
    </div>
  </main>

</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  'use strict';

  /* ============================================================
   *  CONFIGURACIÓN — edita estos valores con los tuyos
   * ============================================================ */
  const CONFIG = {
    // Pega aquí la URL de tu implementación como Aplicación Web de Apps Script
    API_URL: 'PEGA_AQUI_LA_URL_DE_TU_WEB_APP',
    PESO_INICIAL: 104.0,
    META: 80.0,
    FECHA_INICIO: '2026-08-22' // YYYY-MM-DD
  };

  const el = (id) => document.getElementById(id);

  const estado = {
    registros: [],
    filtroMes: 'todo',
    grafico: null,
    mesAbierto: null
  };

  /* ---------- Utilidades de fecha ---------- */
  function fechaLocalDeISO(iso){
    return new Date(iso + 'T00:00:00');
  }
  function hoyISO(){
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dia = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + dia;
  }
  function formatoCorto(iso){
    const f = fechaLocalDeISO(iso);
    return new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short' }).format(f);
  }
  function capitalizar(s){
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  /* ---------- Toast ---------- */
  let toastTimer = null;
  function mostrarToast(mensaje, esError){
    const t = el('toast');
    t.textContent = mensaje;
    t.classList.toggle('error', !!esError);
    t.classList.add('mostrar');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('mostrar'), 3200);
  }

  /* ---------- Cabecera ---------- */
  function pintarCabecera(){
    const hoy = new Date();
    const inicio = fechaLocalDeISO(CONFIG.FECHA_INICIO);
    const dias = Math.max(1, Math.round((hoy.setHours(0,0,0,0) - inicio.setHours(0,0,0,0)) / 86400000) + 1);
    el('txtDiaContador').textContent = 'Día ' + dias;
    const texto = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
    el('txtFechaHoy').textContent = capitalizar(texto);
  }

  /* ---------- Hero + KPIs ---------- */
  function ultimoRegistro(){
    if (!estado.registros.length) return null;
    return estado.registros[estado.registros.length - 1];
  }

  function pintarResumen(){
    const ultimo = ultimoRegistro();
    const pesoActual = ultimo ? ultimo.peso : CONFIG.PESO_INICIAL;
    const inicial = CONFIG.PESO_INICIAL;
    const meta = CONFIG.META;

    el('txtPesoActual').innerHTML = pesoActual.toFixed(1) + ' <small>kg</small>';

    const delta = pesoActual - inicial;
    const deltaEl = el('txtDelta');
    if (!ultimo){
      deltaEl.textContent = 'Aún no hay registros. ¡Agrega el de hoy!';
      deltaEl.className = 'delta';
    } else {
      const signo = delta <= 0 ? '' : '+';
      deltaEl.innerHTML = '<strong>' + signo + delta.toFixed(1) + ' kg</strong> desde el ' + formatoCorto(CONFIG.FECHA_INICIO);
      deltaEl.className = 'delta ' + (delta <= 0 ? 'positivo' : 'negativo');
    }

    const rango = inicial - meta;
    const avance = rango > 0 ? ((inicial - pesoActual) / rango) * 100 : 0;
    const avanceClamp = Math.min(100, Math.max(0, avance));

    el('barraRelleno').style.width = avanceClamp + '%';
    el('txtFlancoInicial').textContent = inicial.toFixed(1) + ' kg';
    el('txtFlancoMeta').textContent = meta.toFixed(1) + ' kg';

    el('txtStatInicial').textContent = inicial.toFixed(1) + ' kg';
    el('txtStatMeta').textContent = meta.toFixed(1) + ' kg';
    el('txtStatProgreso').textContent = Math.round(avanceClamp) + '%';
  }

  /* ---------- Chips de mes ---------- */
  function mesesDisponibles(){
    const vistos = [];
    estado.registros.forEach(r => { if (r.mes && vistos.indexOf(r.mes) === -1) vistos.push(r.mes); });
    return vistos;
  }

  function pintarChips(){
    const cont = el('chipsMeses');
    cont.innerHTML = '';
    const meses = mesesDisponibles();

    const crearChip = (etiqueta, valor) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (estado.filtroMes === valor ? ' activo' : '');
      b.textContent = etiqueta;
      b.addEventListener('click', () => {
        estado.filtroMes = valor;
        pintarChips();
        pintarGrafico();
      });
      cont.appendChild(b);
    };

    crearChip('Todo', 'todo');
    meses.forEach(m => crearChip(m, m));
  }

  /* ---------- Gráfico ---------- */
  const lineaMetaPlugin = {
    id: 'lineaMeta',
    afterDatasetsDraw(chart){
      const { ctx, chartArea, scales } = chart;
      if (!chartArea) return;
      const y = scales.y.getPixelForValue(CONFIG.META);
      if (y < chartArea.top || y > chartArea.bottom) return;
      ctx.save();
      ctx.strokeStyle = 'rgba(193,97,76,0.55)';
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(chartArea.left, y);
      ctx.lineTo(chartArea.right, y);
      ctx.stroke();
      ctx.restore();
    }
  };

  function registrosFiltrados(){
    if (estado.filtroMes === 'todo') return estado.registros;
    return estado.registros.filter(r => r.mes === estado.filtroMes);
  }

  function pintarGrafico(){
    const wrap = document.querySelector('.chart-wrap');
    const datos = registrosFiltrados().filter(r => r.peso !== null);

    if (!datos.length){
      if (estado.grafico){ estado.grafico.destroy(); estado.grafico = null; }
      wrap.innerHTML = '<div class="estado-vacio">Todavía no hay pesajes para mostrar en esta vista.</div>';
      return;
    }

    if (!wrap.querySelector('canvas')){
      wrap.innerHTML = '<canvas id="graficoPeso"></canvas>';
    }

    const etiquetas = datos.map(r => formatoCorto(r.fecha));
    const valores = datos.map(r => r.peso);

    if (estado.grafico){
      estado.grafico.data.labels = etiquetas;
      estado.grafico.data.datasets[0].data = valores;
      estado.grafico.update();
      return;
    }

    const ctx = el('graficoPeso').getContext('2d');
    const gradiente = ctx.createLinearGradient(0, 0, 0, 200);
    gradiente.addColorStop(0, 'rgba(203,163,92,0.28)');
    gradiente.addColorStop(1, 'rgba(203,163,92,0)');

    estado.grafico = new Chart(ctx, {
      type: 'line',
      data: {
        labels: etiquetas,
        datasets: [{
          data: valores,
          borderColor: '#CBA35C',
          backgroundColor: gradiente,
          fill: true,
          tension: 0.35,
          pointRadius: 2.5,
          pointHoverRadius: 5,
          pointBackgroundColor: '#E4C07E',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: {
            grid: { display: false },
            ticks: { color: '#6E6555', maxTicksLimit: 6, font: { size: 11 } }
          },
          y: {
            grid: { color: 'rgba(255,255,255,0.05)' },
            ticks: { color: '#6E6555', font: { size: 11 } }
          }
        }
      },
      plugins: [lineaMetaPlugin]
    });
  }

  /* ---------- Historial agrupado por mes ---------- */
  function agruparPorMes(){
    const grupos = {};
    const orden = [];
    estado.registros.forEach(r => {
      if (!grupos[r.mes]){ grupos[r.mes] = []; orden.push(r.mes); }
      grupos[r.mes].push(r);
    });
    return orden.reverse().map(mes => ({ mes: mes, dias: grupos[mes].slice().reverse() }));
  }

  function pintarHistorial(){
    const cont = el('listaHistorial');
    cont.innerHTML = '';

    if (!estado.registros.length){
      cont.innerHTML = '<div class="estado-vacio-historial">Sin registros todavía. Cuando agregues tu primer pesaje, aparecerá aquí.</div>';
      return;
    }

    const grupos = agruparPorMes();

    grupos.forEach((grupo, idx) => {
      const abierto = estado.mesAbierto === grupo.mes || (estado.mesAbierto === null && idx === 0);

      const wrap = document.createElement('div');
      wrap.className = 'mes-grupo' + (abierto ? ' abierto' : '');

      const cab = document.createElement('button');
      cab.type = 'button';
      cab.className = 'mes-cabecera';
      cab.innerHTML = '<span>' + grupo.mes + '</span><span><span class="conteo">' + grupo.dias.length + ' días</span><span class="flecha">⌄</span></span>';
      cab.addEventListener('click', () => {
        estado.mesAbierto = (estado.mesAbierto === grupo.mes) ? '' : grupo.mes;
        pintarHistorial();
      });
      wrap.appendChild(cab);

      const listaDias = document.createElement('div');
      listaDias.className = 'dias-lista';
      listaDias.style.maxHeight = abierto ? '2000px' : '0';

      grupo.dias.forEach(r => {
        const fila = document.createElement('button');
        fila.type = 'button';
        fila.className = 'dia-fila';
        fila.innerHTML =
          '<span class="izq">' +
            '<span class="fecha-corta">' + formatoCorto(r.fecha) + '</span>' +
            (r.entrenamiento ? '<span class="entreno-tag">' + r.entrenamiento + '</span>' : '') +
          '</span>' +
          '<span class="der">' +
            (r.calorias !== null ? '<span class="cal-dia">' + r.calorias + ' kcal</span>' : '') +
            '<span class="peso-dia">' + (r.peso !== null ? r.peso.toFixed(1) + ' kg' : '—') + '</span>' +
          '</span>';

        const detalle = document.createElement('div');
        detalle.className = 'dia-detalle';
        const medidas = [];
        if (r.cintura !== null) medidas.push('Cintura <b>' + r.cintura + ' cm</b>');
        if (r.pecho !== null) medidas.push('Pecho <b>' + r.pecho + ' cm</b>');
        if (r.brazos !== null) medidas.push('Brazos <b>' + r.brazos + ' cm</b>');
        if (r.piernas !== null) medidas.push('Piernas <b>' + r.piernas + ' cm</b>');

        detalle.innerHTML =
          (medidas.length ? '<div class="medidas"><span>' + medidas.join('</span><span>') + '</span></div>' : '<div class="medidas"><span>Sin medidas registradas este día</span></div>') +
          (r.notas ? '<div class="notas-dia">' + r.notas + '</div>' : '');

        fila.addEventListener('click', () => {
          detalle.classList.toggle('visible');
        });

        listaDias.appendChild(fila);
        listaDias.appendChild(detalle);
      });

      wrap.appendChild(listaDias);
      cont.appendChild(wrap);
    });
  }

  /* ---------- Carga de datos ---------- */
  async function cargarDatos(){
    if (!CONFIG.API_URL || CONFIG.API_URL.indexOf('PEGA_AQUI') === 0){
      el('txtDelta').textContent = 'Configura la URL de tu Web App en el archivo para conectar tus datos.';
      pintarGrafico();
      pintarHistorial();
      return;
    }
    try {
      const resp = await fetch(CONFIG.API_URL);
      const data = await resp.json();
      if (data.status !== 'success') throw new Error(data.message || 'Error desconocido');
      estado.registros = data.registros || [];
    } catch (err) {
      mostrarToast('No se pudo conectar con la hoja de cálculo.', true);
    }
    pintarResumen();
    pintarChips();
    pintarGrafico();
    pintarHistorial();
  }

  /* ---------- Envío del formulario ---------- */
  function limpiarNumero(id){
    const v = el(id).value;
    return v === '' ? '' : Number(v);
  }

  el('formRegistro').addEventListener('submit', async function(ev){
    ev.preventDefault();
    const btn = el('btnGuardar');
    btn.disabled = true;
    btn.textContent = 'Guardando…';

    const payload = {
      fecha: el('inputFecha').value,
      peso: limpiarNumero('inputPeso'),
      calorias: limpiarNumero('inputCalorias'),
      entrenamiento: el('inputEntrenamiento').value.trim(),
      cintura: limpiarNumero('inputCintura'),
      pecho: limpiarNumero('inputPecho'),
      brazos: limpiarNumero('inputBrazos'),
      piernas: limpiarNumero('inputPiernas'),
      notas: el('inputNotas').value.trim()
    };

    try {
      const resp = await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (data.status !== 'success') throw new Error(data.message || 'No se pudo guardar');

      mostrarToast('Registro guardado ✓');
      el('inputCalorias').value = '';
      el('inputEntrenamiento').value = '';
      el('inputCintura').value = '';
      el('inputPecho').value = '';
      el('inputBrazos').value = '';
      el('inputPiernas').value = '';
      el('inputNotas').value = '';
      el('inputFecha').value = hoyISO();

      await cargarDatos();
    } catch (err) {
      mostrarToast('Error al guardar: ' + err.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Guardar registro';
    }
  });

  /* ---------- Inicio ---------- */
  function init(){
    el('inputFecha').value = hoyISO();
    pintarCabecera();
    cargarDatos();
  }

  init();
})();
</script>
</body>
</html>
